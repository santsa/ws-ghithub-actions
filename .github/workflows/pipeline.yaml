name: Pipeline
run-name: Deploy in live

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "*.md"    

jobs:
  job1:
    environment:
      - name: develop
    runs-on: ubuntu-latest
    steps:
      - name: Print message job1
        run: echo "Hello, Algo-${{ vars.NAME }}"

      - name: ECHO SECRETO
        run: echo "${{ secrets.SECRETO }}" > secreto1.txt      

      - name: List files
        run: ls -la

  job2:
    environment:
      - name: production
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Print message job2
        run: echo "Hello, Algo-${{ vars.NAME }}"

      - name: ECHO SECRETO
        run: echo "${{ secrets.SECRETO }}" > secreto2.txt      

      - name: List files
        run: ls -la

  job3:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Print message job2
        run: echo "Hello, Algo-${{ vars.NAME }}"

      - name: ECHO SECRETO
        run: echo "${{ secrets.SECRETO }}" > secreto3.txt      

      - name: List files
        run: ls -la
      
