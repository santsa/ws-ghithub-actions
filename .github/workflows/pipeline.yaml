name: Pipeline
run-name: Deploy in live

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "*.md"    

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: List files
        run: ls -la

      - name: Print message job1
        run: echo "Hello, ${{ vars.NAME }}
}}"

      - name: Echo file
        run: cat hola.txt


  job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Print message job2
        run: echo "Hello, world! job2"
      
